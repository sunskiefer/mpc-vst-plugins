# Checks the device patches: the patch script's contract and catalog/patches.json (docs/PATCHES.md).
name: Patches
on:
  push:
    branches: [main]
    paths: ['catalog/patches.json', 'tools/patch_check.py', 'tools/test_patches.py', 'tools/test_drive_exec.py', 'tools/test_auto_exec.py', 'tools/test_hwremap_patch.py', 'tools/mpc_patch/**', '.github/workflows/patches.yml']
  pull_request:
    paths: ['catalog/patches.json', 'tools/patch_check.py', 'tools/test_patches.py', 'tools/test_drive_exec.py', 'tools/test_auto_exec.py', 'tools/test_hwremap_patch.py', 'tools/mpc_patch/**', '.github/workflows/patches.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_auto_exec.py installs the earlier auto exec scripts from history to test the update
      # The device runs these scripts with BusyBox. ubuntu-latest (26.04 from 2026-11-22) has uutils coreutils, whose dd truncates the
      # file in the drum-pad script's `dd bs=1 seek=N 1<>file` (issue #1085), so test_patches.py puts BusyBox's applets first on PATH.
      - name: BusyBox, the tools the device has
        run: sudo apt-get install -y busybox-static
      - name: Tests
        run: python3 tools/test_patches.py
      - name: Drive exec patch, with real mounts (root, private mount namespace)
        run: sudo python3 tools/test_drive_exec.py
      - name: Auto exec patch, with real mounts (root, private mount namespace)
        run: sudo python3 tools/test_auto_exec.py
      - name: Button remap patch
        run: python3 tools/test_hwremap_patch.py
      - name: Validate the patch manifest
        run: python3 tools/patch_check.py
