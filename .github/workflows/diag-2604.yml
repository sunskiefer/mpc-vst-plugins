# TEMPORARY diagnostic for issue #1085: what differs on ubuntu-latest (26.04) for the drum-pad script's dd byte writes.
# Runs only on pushes to the session branch; never merged.
name: Diag 2604 (temporary)
on:
  push:
    branches: [ccr-b3d89e80-jj5kzg]
    paths: ['.github/workflows/diag-2604.yml']
jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Environment and the dd idiom (shell: sh, as the script)
        shell: sh
        run: |
          head -3 /etc/os-release
          ls -l /bin/sh
          for c in dd od md5sum cat cut tr df printf mktemp; do echo "$c: $(command -v $c) -> $(readlink -f "$(command -v $c)")"; done
          dd --version 2>&1 | head -2
          T=$(mktemp -d); cd "$T"
          head -c 1048576 /dev/zero > f1; cp f1 f2; cp f1 f3
          echo "--- the script's idiom: printf escapes | dd bs=1 seek=16 1<>file"
          printf '\101\102\103' | dd bs=1 seek=16 1<>f1; echo "idiom exit=$?"
          od -An -tx1 -j16 -N4 f1; ls -l f1
          echo "--- portable form: dd of=file bs=1 seek=16 conv=notrunc"
          printf '\101\102\103' | dd of=f2 bs=1 seek=16 conv=notrunc; echo "of= exit=$?"
          od -An -tx1 -j16 -N4 f2; ls -l f2
          echo "--- the hex_to_bytes loop exactly as in the script"
          h=414243; out=""; while [ -n "$h" ]; do r=${h#??}; c=${h%"$r"}; printf "\\$(printf %03o $((0x$c)))"; h=$r; done | od -An -tx1
      - name: The failing test, verbose, plus the script with its stderr visible
        shell: bash
        run: |
          python3 tools/test_patches.py ScriptContract.test_confirmed_install_needs_no_typed_word_then_undo 2>&1 | grep -v ResourceWarning | tail -15 || true
          python3 - <<'EOF'
          import re,hashlib,os,subprocess,tempfile
          S='tools/mpc_patch/mpc-drum-pad-patch.sh'
          src=open(S).read()
          regs=[l.split() for l in re.search(r"PATCH_DATA='(.*?)'\n",src,re.S).group(1).splitlines() if l.strip()]
          size=max(int(o,16)+len(h)//2 for o,h in regs)+64
          stock=bytearray(size); patched=bytearray(stock)
          for o,h in regs: patched[int(o,16):int(o,16)+len(h)//2]=bytes.fromhex(h)
          sm=hashlib.md5(bytes(stock)).hexdigest(); pm=hashlib.md5(bytes(patched)).hexdigest()
          s=re.sub(r"^STOCK_MD5=\S+","STOCK_MD5="+sm,src,flags=re.M); s=re.sub(r"^PATCHED_MD5=\S+","PATCHED_MD5="+pm,s,flags=re.M)
          s=s.replace('1<>"$F" 2>/dev/null','1<>"$F"')   # show dd's own errors
          d=tempfile.mkdtemp(); open(d+'/s.sh','w').write(s); open(d+'/stock','wb').write(bytes(stock))
          env=dict(os.environ,MPC_PATCH_TEST=d+'/stock',MPC_PATCH_BACKUP=d+'/bk')
          r=subprocess.run(['sh','-x',d+'/s.sh','install','--confirmed'],env=env,stdin=subprocess.DEVNULL,capture_output=True,text=True)
          err=r.stderr.splitlines()
          print('exit',r.returncode); print('\n'.join(r.stdout.splitlines()[-6:]))
          print('--- last stderr lines (dd errors show here)'); print('\n'.join([l for l in err if 'dd' in l or 'rror' in l or 'write' in l][:20]))
          print('final md5 == patched?', hashlib.md5(open(d+'/stock','rb').read()).hexdigest()==pm)
          EOF
      - name: The other three patch test scripts on this image
        shell: bash
        continue-on-error: true
        run: |
          python3 tools/test_hwremap_patch.py 2>&1 | grep -v ResourceWarning | tail -4
          sudo python3 tools/test_drive_exec.py 2>&1 | grep -v ResourceWarning | tail -6
          sudo python3 tools/test_auto_exec.py 2>&1 | grep -v ResourceWarning | tail -6
  with-gnu-coreutils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch to GNU coreutils, then the patch tests
        shell: bash
        run: |
          apt-cache policy coreutils-from-gnu 2>&1 | head -3
          sudo apt-get install -y coreutils-from-gnu 2>&1 | tail -2 || true
          dd --version 2>&1 | head -1
          python3 tools/test_patches.py 2>&1 | grep -v ResourceWarning | tail -6
  with-busybox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: busybox-static, and the script run with BusyBox applets first on PATH
        shell: bash
        run: |
          sudo apt-get install -y busybox-static 2>&1 | tail -1
          busybox | head -1
          B=$(mktemp -d); for a in sh dd od md5sum cat cut tr df awk sed grep mktemp mkdir mv rm cp ls date sleep head tail wc sort uniq stat; do ln -s "$(command -v busybox)" "$B/$a"; done
          export PATH="$B:$PATH"
          command -v dd; dd --help 2>&1 | head -1
          python3 tools/test_patches.py 2>&1 | grep -v ResourceWarning | tail -6
