# Reusable: build a port, package it with tools/release.py and attach the zip to a DRAFT release
# in the calling repo. A person then installs that exact zip on a device (docs/RELEASING.md steps
# 4-5), and publishes the draft, which creates the tag. See docs/RELEASING.md "Releasing from CI".
#
# Call it from the port's repo, pinning this repo to one commit in BOTH places:
#   uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@<sha>
#   with: { tools_ref: <sha>, ... }
name: VST draft release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. maze-voice-vst-v1.2.0
        type: string
        required: true
      version:
        description: Version for the zip and INSTALL.md, e.g. 1.2.0
        type: string
        required: true
      tools_ref:
        description: This repo's commit - the same one as in the caller's uses:@ref
        type: string
        required: true
      vst_dir:
        description: The port's vst folder, relative to the caller's repo root; the build writes <vst_dir>/build (not with sdk_project)
        type: string
        default: ''
      build:
        description: Command, run from the caller's repo root, that fills <vst_dir>/build (so, skin/, pluginlist-entry.xml); MPC_VST is set (not with sdk_project)
        type: string
        default: ''
      sdk_project:
        description: >-
          An Akai SDK plugin project (folder with plugin.json and src/), relative to the caller's repo root, instead of vst_dir + build.
          It is built for both CPUs with the SDK pinned in this repo (vendor/mpc-plugin-builder-sdk, tools/build.py) and packaged with
          tools/sdk_release.py: the same per-build zips (MPC OS 3.9.1 registration included) plus the SDK zip. A CPU result goes in
          <sdk_project>/bench.txt.
        type: string
        default: ''
      host_test:
        description: Optional host test command (e.g. "$MPC_VST/tools/test_port.sh" path/vst.json)
        type: string
        default: ''
      extra:
        description: Optional release.py --extra SRC:DEST specs, space-separated, SRC relative to the caller's repo root
        type: string
        default: ''
      extra_aarch64:
        description: The same as extra, for the Gen2 (aarch64) zip, when the build left build/aarch64/<so> (an engine bundle is built per CPU). Empty = use extra
        type: string
        default: ''
      user_data:
        description: Folders inside the plugin folder that hold the user's own files (ROMs, banks), space-separated; the installer keeps them and moves them in from the old layout
        type: string
        default: ''
      asset_name:
        description: File-name stem of the release zips when it must not follow the plugin name (a renamed plugin whose asset names other tools match), e.g. Plugin-Manager-G2
        type: string
        default: ''
      retire:
        description: Old plugin folders this release replaces (a renamed plugin), separated by '|', e.g. 'Me - VST - Old Name'; the installer removes each one that is this plugin's and moves its user data (release.py --retire)
        type: string
        default: ''
      about:
        description: One line about the plugin, for INSTALL.md and the release notes
        type: string
        default: ''
      plugin_id:
        description: Catalog id (lowercase, hyphens); default is derived from the plugin name
        type: string
        default: ''
      license:
        description: SPDX license id of the plugin (e.g. MIT); required to be listed in the catalog
        type: string
        default: ''
      requires:
        description: One line of extra requirements for the manifest (e.g. a firmware)
        type: string
        default: ''
      depends:
        description: Other catalog plugins this release needs, space separated (e.g. percolator>=2.0.0 or tr-mpc=same; docs/CATALOG_SPEC.md "Dependencies")
        type: string
        default: ''
      conflicts:
        description: Catalog ids this release must not be installed with, space separated
        type: string
        default: ''
      zig:
        description: zig version to install, if the build needs it
        type: string
        default: ''
      gen2_only:
        description: The port has only a Gen2 (aarch64) build, in <vst_dir>/build/aarch64/<so>; no 32-bit .so is expected and only the -mpc-aarch64.zip is made
        type: boolean
        default: false
      dry_run:
        description: Build and package only (zip + previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      VST_DIR: ${{ inputs.vst_dir }}
      MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse to touch a published release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                    --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          echo "existing release for $TAG: ${state:-none}"
          if [ "$state" = published ]; then
            echo "::error::$TAG is already published - bump the version"; exit 1
          fi

      - name: Check out the port
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: port

      - name: Check out mpc-vst-plugins (tools)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: open-mpc/mpc-vst-plugins
          ref: ${{ inputs.tools_ref }}
          path: mpc-vst-plugins

      - name: Check the inputs
        env:
          SDK_PROJECT: ${{ inputs.sdk_project }}
          BUILD: ${{ inputs.build }}
        run: |
          if [ -n "$SDK_PROJECT" ]; then
            [ -z "$VST_DIR$BUILD" ] || { echo "::error::sdk_project replaces vst_dir and build: give one or the other"; exit 1; }
            [ -f "port/$SDK_PROJECT/plugin.json" ] || { echo "::error::no plugin.json in $SDK_PROJECT"; exit 1; }
          else
            [ -n "$VST_DIR" ] && [ -n "$BUILD" ] || { echo "::error::give vst_dir and build (or sdk_project for an Akai SDK project)"; exit 1; }
          fi

      - name: Fetch the pinned Akai SDK
        if: ${{ inputs.sdk_project != '' }}
        run: git -C mpc-vst-plugins submodule update --init --depth 1 vendor/mpc-plugin-builder-sdk

      - name: Set up QEMU (plugins are built for armhf, and for aarch64 when the port asks, under emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Set up zig
        if: ${{ inputs.zig != '' }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ inputs.zig }}

      - name: Install Pillow (skin and previews)
        run: python3 -m pip install --quiet pillow

      - name: Build
        if: ${{ inputs.sdk_project == '' }}
        working-directory: port
        env:
          BUILD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$BUILD"

      - name: Host test
        if: ${{ inputs.host_test != '' && inputs.sdk_project == '' }}
        working-directory: port
        env:
          HOST_TEST: ${{ inputs.host_test }}
        run: bash -euo pipefail -c "$HOST_TEST"

      - name: Build and package an Akai SDK project
        id: pkg_sdk
        if: ${{ inputs.sdk_project != '' }}
        working-directory: port
        env:
          SDK_PROJECT: ${{ inputs.sdk_project }}
          ABOUT: ${{ inputs.about }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          LICENSE_ID: ${{ inputs.license }}
          REQUIRES: ${{ inputs.requires }}
          DEPENDS: ${{ inputs.depends }}
          CONFLICTS: ${{ inputs.conflicts }}
          USER_DATA: ${{ inputs.user_data }}
          RETIRE: ${{ inputs.retire }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          SDK="$MPC_VST/vendor/mpc-plugin-builder-sdk"
          python3 "$SDK/tools/build.py" "$SDK_PROJECT" --target all   # zig (downloads itself), both CPUs, validate, native host build
          folders=("$SDK_PROJECT"/build/*" - VST - "*/)
          [ ${#folders[@]} = 1 ] && [ -d "${folders[0]}" ] || { echo "::error::expected one '<maker> - VST - <name>' folder in $SDK_PROJECT/build"; exit 1; }
          folder="${folders[0]%/}"
          args=("$folder" --version "$VERSION" --repo "$GITHUB_REPOSITORY" -o "$GITHUB_WORKSPACE/dist")
          [ -z "$ABOUT" ] || args+=(--about "$ABOUT")
          [ -z "$PLUGIN_ID" ] || args+=(--id "$PLUGIN_ID")
          [ -z "$LICENSE_ID" ] || args+=(--license "$LICENSE_ID")
          [ -z "$REQUIRES" ] || args+=(--requires "$REQUIRES")
          for d in $DEPENDS; do args+=(--depends "$d"); done
          for c in $CONFLICTS; do args+=(--conflicts "$c"); done
          for u in $USER_DATA; do args+=(--user-data "$u"); done
          [ -z "$ASSET_NAME" ] || args+=(--asset-name "$ASSET_NAME")
          IFS='|' read -r -a retired <<< "$RETIRE"; for r in "${retired[@]}"; do [ -z "$r" ] || args+=(--retire "$r"); done
          if [ -f "$SDK_PROJECT/bench.txt" ]; then
            args+=(--bench "$SDK_PROJECT/bench.txt"); bench="from committed $SDK_PROJECT/bench.txt"
          else
            bench="**not measured** - no $SDK_PROJECT/bench.txt, so INSTALL.md has no CPU section"
          fi
          python3 "$MPC_VST/tools/sdk_release.py" "${args[@]}"
          mkdir -p "$GITHUB_WORKSPACE/previews"
          python3 "$MPC_VST/tools/studio.py" preview "$folder/Plugin Skins" -o "$GITHUB_WORKSPACE/previews/page_%d.png" || echo "::notice::no skin preview (the SDK skin format may differ)"
          zip=$(ls "$GITHUB_WORKSPACE"/dist/*-mpc-armv7.zip 2>/dev/null || ls "$GITHUB_WORKSPACE"/dist/*-mpc-aarch64.zip)
          zips=$(ls "$GITHUB_WORKSPACE"/dist/*.zip | tr '\n' ' ')
          if [ -n "$LICENSE_ID" ]; then flag=--catalog; else flag=""; echo "::warning::no license input: this release can't be listed in the catalog"; fi
          for z in $zips; do python3 "$MPC_VST/tools/catalog_check.py" "$z" $flag; done
          base=$(basename "$zip" | sed 's/-mpc-\(armv7\|aarch64\)\.zip$//')
          builds=$(ls "$GITHUB_WORKSPACE"/dist/*-mpc-armv7.zip "$GITHUB_WORKSPACE"/dist/*-mpc-aarch64.zip 2>/dev/null | tr '\n' ' ')
          python3 "$MPC_VST/tools/sdk_zip.py" "$GITHUB_WORKSPACE/dist/$base-mpc-sdk.zip" $builds
          zips="$zips$GITHUB_WORKSPACE/dist/$base-mpc-sdk.zip "
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "zips=$zips" >> "$GITHUB_OUTPUT"
          echo "name=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$folder/plugin.json")" >> "$GITHUB_OUTPUT"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"

      - name: Package with release.py
        id: pkg
        if: ${{ inputs.sdk_project == '' }}
        working-directory: port
        env:
          EXTRA: ${{ inputs.extra }}
          EXTRA_AARCH64: ${{ inputs.extra_aarch64 }}
          ABOUT: ${{ inputs.about }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          LICENSE_ID: ${{ inputs.license }}
          REQUIRES: ${{ inputs.requires }}
          DEPENDS: ${{ inputs.depends }}
          CONFLICTS: ${{ inputs.conflicts }}
          USER_DATA: ${{ inputs.user_data }}
          RETIRE: ${{ inputs.retire }}
          ASSET_NAME: ${{ inputs.asset_name }}
          GEN2_ONLY: ${{ inputs.gen2_only }}
        run: |
          B="$VST_DIR/build"
          entry="$B/pluginlist-entry.xml"
          so="$B/$(sed -n 's/.* file="[^"]*\/\([^"/]*\)".*/\1/p' "$entry")"
          skins=("$B"/skin/*/)
          [ ${#skins[@]} = 1 ] || { echo "::error::expected one skin folder in $B/skin, found ${#skins[@]}"; exit 1; }
          skin="${skins[0]%/}"
          [ -d "$skin" ] || { echo "::error::no skin folder in $B/skin"; exit 1; }
          [ "$GEN2_ONLY" = true ] || file -b "$so" | grep -q 'ELF 32-bit LSB.*ARM' || { echo "::error::$so is not a 32-bit ARM ELF: $(file -b "$so")"; exit 1; }
          args=(--so "$so" --skin "$skin" --entry "$entry" --version "$VERSION" --about "$ABOUT" --repo "$GITHUB_REPOSITORY" -o "$GITHUB_WORKSPACE/dist")
          [ -z "$PLUGIN_ID" ] || args+=(--id "$PLUGIN_ID")
          [ -z "$LICENSE_ID" ] || args+=(--license "$LICENSE_ID")
          [ -z "$REQUIRES" ] || args+=(--requires "$REQUIRES")
          for d in $DEPENDS; do args+=(--depends "$d"); done
          for c in $CONFLICTS; do args+=(--conflicts "$c"); done
          if [ -f "$VST_DIR/bench.txt" ]; then
            args+=(--bench "$VST_DIR/bench.txt"); bench="from committed $VST_DIR/bench.txt"
          else
            bench="**not measured** - no $VST_DIR/bench.txt, so INSTALL.md has no CPU section"
          fi
          for e in $EXTRA; do args+=(--extra "$e"); done
          for u in $USER_DATA; do args+=(--user-data "$u"); done
          [ -z "$ASSET_NAME" ] || args+=(--asset-name "$ASSET_NAME")
          IFS='|' read -r -a retired <<< "$RETIRE"; for r in "${retired[@]}"; do [ -z "$r" ] || args+=(--retire "$r"); done   # folder names have spaces
          [ "$GEN2_ONLY" = true ] || python3 "$MPC_VST/tools/release.py" "${args[@]}"   # gen2_only: there is no 32-bit build to package
          # Gen2: a port whose vst.json lists the aarch64 target also has build/aarch64/<so>: package it the same way (docs/GEN2.md).
          # The CPU result is a Gen1 measurement, so the Gen2 zip does not carry it.
          so64="$B/aarch64/$(basename "$so")"
          if [ "$GEN2_ONLY" = true ] && [ ! -f "$so64" ]; then echo "::error::gen2_only, but there is no $so64"; exit 1; fi
          if [ -f "$so64" ]; then
            file -b "$so64" | grep -q 'ELF 64-bit LSB.*aarch64' || { echo "::error::$so64 is not an aarch64 ELF: $(file -b "$so64")"; exit 1; }
            args64=()
            skip=0
            for a in "${args[@]}"; do
              if [ $skip = 1 ]; then skip=0; continue; fi
              case "$a" in --bench|--extra) skip=1; continue ;; --so) args64+=(--so "$so64"); skip=1; continue ;; esac
              args64+=("$a")
            done
            for e in ${EXTRA_AARCH64:-$EXTRA}; do args64+=(--extra "$e"); done
            python3 "$MPC_VST/tools/release.py" "${args64[@]}"
          fi
          mkdir -p "$GITHUB_WORKSPACE/previews"
          python3 "$MPC_VST/tools/studio.py" preview "$skin/Plugin Skins" -o "$GITHUB_WORKSPACE/previews/page_%d.png"
          zip=$(ls "$GITHUB_WORKSPACE"/dist/*-mpc-armv7.zip 2>/dev/null || ls "$GITHUB_WORKSPACE"/dist/*-mpc-aarch64.zip)
          zips=$(ls "$GITHUB_WORKSPACE"/dist/*.zip | tr '\n' ' ')
          # catalog conformance (docs/CATALOG_SPEC.md): warnings are shown, errors fail the run
          if [ -n "$LICENSE_ID" ]; then flag=--catalog; else flag=""; echo "::warning::no license input: this release can't be listed in the catalog"; fi
          for z in $zips; do python3 "$MPC_VST/tools/catalog_check.py" "$z" $flag; done
          # Akai SDK format (MPC OS 3.10.1+): one folder for both builds, tools/sdk_zip.py. A plugin with per-build files can't be one
          # folder: that is a notice, not a failure, and the per-build zips are the release as before.
          base=$(basename "$zip" | sed 's/-mpc-\(armv7\|aarch64\)\.zip$//')
          builds=$(ls "$GITHUB_WORKSPACE"/dist/*-mpc-armv7.zip "$GITHUB_WORKSPACE"/dist/*-mpc-aarch64.zip 2>/dev/null | tr '\n' ' ')
          if python3 "$MPC_VST/tools/sdk_zip.py" "$GITHUB_WORKSPACE/dist/$base-mpc-sdk.zip" $builds; then
            zips="$zips$GITHUB_WORKSPACE/dist/$base-mpc-sdk.zip "
          else
            rm -f "$GITHUB_WORKSPACE/dist/$base-mpc-sdk.zip"; echo "::notice::no SDK-format zip (see the message above); the per-build zips are the release"
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "zips=$zips" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/.* name="\([^"]*\)".*/\1/p' "$entry")" >> "$GITHUB_OUTPUT"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"

      - name: Upload zip and skin previews as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: |
            dist/*.zip
            previews/
          retention-days: 14

      - name: Create or update the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pkg.outputs.zip || steps.pkg_sdk.outputs.zip }}
          ZIPS: ${{ steps.pkg.outputs.zips || steps.pkg_sdk.outputs.zips }}
          NAME: ${{ steps.pkg.outputs.name || steps.pkg_sdk.outputs.name }}
          ABOUT: ${{ inputs.about }}
          TOOLS_REF: ${{ inputs.tools_ref }}
        run: |
          python3 - "$ZIP" > notes.md <<'PY'
          import os, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          md = z.read(next(n for n in z.namelist() if n.endswith("/INSTALL.md"))).decode()
          keep = [s for s in re.split(r"(?m)^(?=## )", md) if s.startswith(("## Requirements", "## Install (scripted)"))]
          if os.environ["ABOUT"]:
              print(os.environ["ABOUT"] + "\n")
          print("".join(keep).rstrip() + "\n")
          print("Full instructions, including installing by hand, are in `INSTALL.md` inside the zip.")
          PY
          printf '\n---\nBuilt by GitHub Actions from %s@%s with mpc-vst-plugins@%s.\n' \
            "$GITHUB_REPOSITORY" "${GITHUB_SHA::7}" "${TOOLS_REF::7}" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ZIPS --clobber
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "$NAME VST v$VERSION" --notes-file notes.md
          else
            gh release create "$TAG" $ZIPS --draft --target "$GITHUB_SHA" --title "$NAME VST v$VERSION" --notes-file notes.md
          fi

      - name: Summary
        env:
          ZIPS: ${{ steps.pkg.outputs.zips || steps.pkg_sdk.outputs.zips }}
          BENCH: ${{ steps.pkg.outputs.bench || steps.pkg_sdk.outputs.bench }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "## $TAG"
            if [ "$DRY" = true ]; then
              echo "Dry run: no release. The zip and skin previews are in this run's artifacts."
            else
              echo "Draft release updated: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases (drafts are only visible to maintainers)."
            fi
            for z in $ZIPS; do echo "- Zip: \`$(basename "$z")\` ($(du -h "$z" | cut -f1))"; done
            echo "- CPU: $BENCH"
            echo
            echo "Before publishing (docs/RELEASING.md):"
            echo "1. Look at every skin preview (this run's artifacts)."
            echo "2. Install **this** zip on a device with its install.sh and smoke-test it: every page and Q-Link, save and reload a project, uninstall."
            echo "3. CPU: run tools/bench.sh on the device and commit its -j output as \`$VST_DIR/bench.txt\` if it's missing or stale, then re-run this workflow."
            echo "4. Publish the draft. That creates the tag."
          } >> "$GITHUB_STEP_SUMMARY"
