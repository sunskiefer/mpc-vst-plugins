# Tests tools/plugin_manager_g2 (the OpenMPC Plugin Manager VST, a VST that installs plugins on the MPC itself) on every change;
# "Run workflow" builds the Gen1 (armv7) and Gen2 (aarch64) zips into a DRAFT release (plugin-manager-g2-v<version>) with vst-release.yml, for a person to
# install on a device and then publish (docs/RELEASING.md "Releasing from CI"). Start with dry_run: the zip comes as a run artifact.
name: Plugin Manager G2
on:
  push:
    branches: [main]
    paths: ['tools/plugin_manager_g2/**', '.github/workflows/plugin-manager-g2.yml']
  pull_request:
    paths: ['tools/plugin_manager_g2/**', '.github/workflows/plugin-manager-g2.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.5
        required: true
      dry_run:
        description: Build and package only (the zip as a run artifact), no draft release
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  # A release ("Run workflow") of a commit whose push run already passed the tests reuses that result instead of testing again.
  tested:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ok: ${{ steps.find.outputs.ok }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=false
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/plugin-manager-g2.yml/runs?head_sha=${{ github.sha }}&status=success&event=push" --jq '.total_count' || echo 0)
            [ "${n:-0}" -gt 0 ] && ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "tests already passed on ${{ github.sha }}: $ok"
  test:
    needs: tested
    if: ${{ needs.tested.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:   # one section per job, in parallel (tests/run.sh ONLY=<section>); a section sets up its own fake devices
        section: [devices, addins, links, vst2, pick, theme, safety, arch, web]
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests, section ${{ matrix.section }} (host test under ASan; they read the live catalog)
        env:
          ONLY: ${{ matrix.section }}
        run: tools/plugin_manager_g2/tests/run.sh
  version:   # checked even when the tests are reused
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          v=$(sed -n 's/^#define PM_VERSION "\(.*\)"/\1/p' tools/plugin_manager_g2/src/manager.c)
          [ "$v" = "$VERSION" ] || { echo "::error::PM_VERSION is $v but the release version is $VERSION: bump PM_VERSION in manager.c"; exit 1; }
  release:
    needs: [tested, test, version]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.version.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.tested.outputs.ok == 'true')) }}
    permissions:
      contents: write
    uses: ./.github/workflows/vst-release.yml
    with:
      tag: plugin-manager-g2-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: ${{ github.sha }}
      vst_dir: tools/plugin_manager_g2/vst
      build: tools/plugin_manager_g2/vst/build_themes.sh all
      about: Browse the OpenMPC catalog and install, update and remove plugins on the MPC itself, with rollback; for Gen1 and Gen2.
      plugin_id: plugin-manager-g2
      asset_name: Plugin-Manager-G2   # kept after the rename: the catalog's asset_pattern, the stick builder and installer 2.0.0 match it
      retire: OpenMPC - VST - Plugin Manager G2   # renamed "Plugin Manager" in 1.1.0: an update removes the old folder
      license: MIT
      dry_run: ${{ inputs.dry_run }}
